# Dependabot is configured for the bun ecosystem so version bumps
# regenerate bun.lock together with package.json. The previous
# GitHub-side npm-style updates changed package.json only, which made
# every Dependabot PR fail CI at `bun install --frozen-lockfile`
# (see #196). bun.lock lives at the repository root and covers all
# workspace packages, so a single root entry handles the monorepo.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # The @modelcontextprotocol/* packages must move as one: client and
    # server depend exactly on the matching core version, a split bump
    # resolves two copies of MCP core, and the version-keyed client patch
    # in patches/ must be re-based in the same PR (see #196/#199/#201).
    groups:
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
