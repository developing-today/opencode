# Dependabot is configured for the bun ecosystem so version bumps
# regenerate bun.lock together with package.json. The previous
# GitHub-side npm-style updates changed package.json only, which made
# every Dependabot PR fail CI at `bun install --frozen-lockfile`
# (see #196). bun.lock lives at the repository root and covers all
# workspace packages, so a single root entry handles the monorepo.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # The @modelcontextprotocol/* packages must move as one: client and
    # server depend exactly on the matching core version, a split bump
    # resolves two copies of MCP core, and the version-keyed client patch
    # in patches/ must be re-based in the same PR (see #196/#199/#201).
    # A group covers only one update type: with no applies-to, mcp-sdk
    # defaults to version updates, so the security group below is a
    # separate, separately named group with the same patterns (#210).
    groups:
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      mcp-sdk-security:
        applies-to: "security-updates"
        patterns:
          - "@modelcontextprotocol/*"
      # The Storybook packages in packages/storybook must also move as
      # one: the addons and builder pin the same version as `storybook`
      # itself, and a split bump leaves the family on mixed versions
      # (see #257). Same split as mcp-sdk above: the version group here,
      # the security group in the npm entry below.
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      storybook-security:
        applies-to: "security-updates"
        patterns:
          - "storybook"
          - "@storybook/*"
  # Security updates for JavaScript manifests do not run under the bun
  # entry above: they arrive as npm_and_yarn jobs scoped to the manifest's
  # directory (e.g. PR #200, dependabot/npm_and_yarn/packages/desktop/…),
  # so a bun-only group would never match one. This entry covers the one
  # directory that pins @modelcontextprotocol/* (packages/core) and exists
  # for security updates only — open-pull-requests-limit: 0 disables
  # version updates for it, so weekly version bumps keep flowing through
  # the bun entry and regenerate bun.lock (see #196). Group rules in this
  # file override the repository/organization "grouped security updates"
  # setting for the directories configured here.
  - package-ecosystem: "npm"
    directory: "/packages/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      mcp-sdk-security:
        applies-to: "security-updates"
        patterns:
          - "@modelcontextprotocol/*"
  # Same story for packages/storybook, whose security updates arrived
  # ungrouped and lockfile-less as PRs #255/#256 (see #257): the directory
  # pins seven Storybook packages that must move together, so its
  # security-only npm entry carries the storybook-security group.
  - package-ecosystem: "npm"
    directory: "/packages/storybook"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      storybook-security:
        applies-to: "security-updates"
        patterns:
          - "storybook"
          - "@storybook/*"
