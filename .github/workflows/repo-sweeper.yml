name: repo-sweeper
# CI tier policy: .github/ci-policy.md (fast PR tier, full main tier).
#
# EVENT-BOT CONSOLIDATION (2026-10-29, Drew directive): this single
# scheduled sweeper replaces the event-triggered issue/PR management
# workflows. Deleted and absorbed:
#   - pr-management.yml    (duplicate-PR LLM comment, contributor label)
#   - duplicate-issues.yml (issue compliance + duplicate LLM check,
#                           needs:compliance recheck on edit)
#   - triage.yml           (LLM triage of new issues)
#   - close-issues.yml     (daily stale-issue closer; was scheduled)
#   - close-prs.yml        (daily low-reaction PR closer; was scheduled)
#   - compliance-close.yml (72h needs:compliance closer; was scheduled)
#
# Management work is not synchronous: nobody waits on a label, a
# duplicate note or a stale close the second an event fires, so it
# runs in one pass every 15 minutes instead of fanning out per event.
# Deterministic duties run first (fast); LLM duties run last, newest
# first, capped per pass, over a 20-minute lookback window (overlapping
# the 15-minute cadence so nothing falls between passes; LLM comment
# markers make repeat passes idempotent where the originals were
# single-shot).
#
# KEPT event-based (a human waits synchronously): opencode.yml (/oc and
# /opencode mention bot) and review.yml (/review command). pr-standards
# stays as a pull_request_target VALIDATION workflow (PR standards /
# template compliance checks) in the tier system. main-broken.yml
# (Phase 3 remediation chain) is workflow_run-triggered and unchanged.
#
# Trade-off, accepted: with cancel-in-progress: true a still-running
# sweep is superseded by the next one. Duties are ordered so the fast
# deterministic ones always complete, and anything an LLM pass misses
# is picked up by the next pass while it is inside the window; the
# daily-gated closers resume the next day (closed items leave the
# pool, so progress is never lost).

# Daily closers run on schedule only: a manual dispatch exercises the
# 15-minute duties and LLM passes but never closes issues/PRs.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# One live sweep at a time; a newer sweep supersedes a stale one.
concurrency:
  group: repo-sweeper
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sweep:
    name: repo sweep
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # ---- Deterministic duties (absorbed: pr-management contributor
      # ---- label; compliance-close 72h closer, ported verbatim) ----
      - name: Deterministic duties (contributor labels, compliance closes)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Duty 1: contributor label for CONTRIBUTOR-association PRs.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            for (const pr of pulls) {
              if (pr.author_association !== 'CONTRIBUTOR') continue;
              if (pr.labels.some((l) => l.name === 'contributor')) continue;
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: ['contributor'],
              });
              core.info(`Added contributor label to PR #${pr.number}`);
            }

            // Duty 2: close needs:compliance items 72h after the
            // compliance comment (exempt authors lose the label instead).
            const { data: items } = await github.rest.issues.listForRepo({
              owner, repo, labels: 'needs:compliance', state: 'open', per_page: 100,
            });
            if (items.length === 0) {
              core.info('No open issues/PRs with needs:compliance label');
              return;
            }
            const now = Date.now();
            const seventyTwoHours = 72 * 60 * 60 * 1000;
            const orgMemberAssociations = new Set(['OWNER', 'MEMBER']);
            const agentLogin = 'opencode-agent[bot]';
            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path: '.github/TEAM_MEMBERS', ref: 'main',
            });
            const teamMembers = new Set(
              Buffer.from(file.content, 'base64').toString().split('\n')
                .map((line) => line.trim().toLowerCase()).filter(Boolean)
            );
            function isExempt(item) {
              const login = item.user?.login?.toLowerCase();
              return (
                login === agentLogin ||
                orgMemberAssociations.has(item.author_association) ||
                (login && teamMembers.has(login))
              );
            }
            for (const item of items) {
              const isPR = !!item.pull_request;
              const kind = isPR ? 'PR' : 'issue';
              const login = item.user?.login;
              if (isExempt(item)) {
                core.info(`Skipping ${kind} #${item.number}; author ${login || 'unknown'} is exempt`);
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: item.number, name: 'needs:compliance',
                  });
                } catch (e) {}
                continue;
              }
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: item.number,
              });
              const complianceComment = comments.find((c) => c.body.includes('<!-- issue-compliance -->'));
              if (!complianceComment) continue;
              const commentAge = now - new Date(complianceComment.created_at).getTime();
              if (commentAge < seventyTwoHours) {
                core.info(`${kind} #${item.number} still within 72-hour window (${Math.round(commentAge / 60000)}m elapsed)`);
                continue;
              }
              const closeMessage = isPR
                ? 'This pull request has been automatically closed because it was not updated to meet our [contributing guidelines](../blob/main/CONTRIBUTING.md) within the 72-hour window.\n\nFeel free to open a new pull request that follows our guidelines.'
                : 'This issue has been automatically closed because it was not updated to meet our [contributing guidelines](../blob/main/CONTRIBUTING.md) within the 72-hour window.\n\nFeel free to open a new issue that follows our issue templates.';
              await github.rest.issues.createComment({
                owner, repo, issue_number: item.number, body: closeMessage,
              });
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: item.number, name: 'needs:compliance',
                });
              } catch (e) {}
              if (isPR) {
                await github.rest.pulls.update({
                  owner, repo, pull_number: item.number, state: 'closed',
                });
              } else {
                await github.rest.issues.update({
                  owner, repo, issue_number: item.number, state: 'closed', state_reason: 'not_planned',
                });
              }
              core.info(`Closed non-compliant ${kind} #${item.number} after 72-hour window`);
            }

      # ---- Daily closers (absorbed: close-issues at 02:00 UTC,
      # ---- close-prs at 22:00 UTC; gated to their original hours) ----
      - name: Close stale issues (daily, 02:00 UTC window)
        run: |
          # Schedule events carry no timestamp input; gate on the clock.
          HOUR=$(date -u +%H)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$HOUR" != "02" ]; then
            echo "Not the 02:00 UTC window (hour=$HOUR); skipping stale-issue close"
            exit 0
          fi
          bun script/github/close-issues.ts

      - name: Close old PRs without enough positive reactions (daily, 22:00 UTC window)
        run: |
          HOUR=$(date -u +%H)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$HOUR" != "22" ]; then
            echo "Not the 22:00 UTC window (hour=$HOUR); skipping old-PR close"
            exit 0
          fi
          args=("--threshold" "2" "--age-months" "1" "--sleep-ms" "20000" "--max-close" "50" "--execute")
          bun script/github/close-prs.ts "${args[@]}"

      # ---- LLM candidate discovery (20-minute lookback) ----
      - name: Discover LLM candidates
        id: candidates
        run: |
          SINCE=$(date -u -d '20 minutes ago' +%s)
          echo "since_epoch=$SINCE" >> "$GITHUB_OUTPUT"
          # New issues: number, association, login (newest first)
          gh issue list --state open --limit 100 \
            --json number,author,authorAssociation,createdAt \
            --jq "[.[] | select((.createdAt | fromdateiso8601) > $SINCE)] | sort_by(.createdAt) | reverse | .[] | \"\(.number) \(.authorAssociation) \(.author.login)\"" \
            > new_issues.txt || true
          # Compliance rechecks: needs:compliance issues updated in window
          gh issue list --state open --label needs:compliance --limit 100 \
            --json number,author,authorAssociation,updatedAt \
            --jq "[.[] | select((.updatedAt | fromdateiso8601) > $SINCE)] | sort_by(.updatedAt) | reverse | .[] | \"\(.number) \(.authorAssociation) \(.author.login)\"" \
            > recheck_issues.txt || true
          # New PRs for the duplicate check
          gh pr list --state open --limit 100 \
            --json number,author,authorAssociation,createdAt \
            --jq "[.[] | select((.createdAt | fromdateiso8601) > $SINCE)] | sort_by(.createdAt) | reverse | .[] | \"\(.number) \(.authorAssociation) \(.author.login)\"" \
            > new_prs.txt || true
          echo "new issues: $(wc -l < new_issues.txt), rechecks: $(wc -l < recheck_issues.txt), new PRs: $(wc -l < new_prs.txt)"
          TOTAL=$(( $(wc -l < new_issues.txt) + $(wc -l < recheck_issues.txt) + $(wc -l < new_prs.txt) ))
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Install opencode
        if: steps.candidates.outputs.total != '0'
        run: curl -fsSL https://opencode.ai/install | bash

      # ---- LLM duty: new-issue compliance + duplicate check, then
      # ---- triage (absorbed: duplicate-issues check-duplicates,
      # ---- triage). Exempt authors skipped exactly as before. ----
      - name: New issues (compliance + duplicates, then triage)
        if: steps.candidates.outputs.total != '0'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          COUNT=0
          while read -r N ASSOC LOGIN; do
            [ -n "$N" ] || continue
            if [ "$COUNT" -ge 3 ]; then echo "per-pass cap reached"; break; fi
            if [ "$LOGIN" = "opencode-agent[bot]" ] || [ "$ASSOC" = "OWNER" ] || [ "$ASSOC" = "MEMBER" ] || grep -qxiF "$LOGIN" .github/TEAM_MEMBERS; then
              echo "Skipping exempt author $LOGIN for issue #$N"; continue
            fi
            COUNT=$((COUNT + 1))
            echo "=== issue #$N (compliance + duplicate check) ==="
            OPENCODE_PERMISSION='{"bash": {"*": "deny", "gh issue*": "allow"}, "webfetch": "deny"}' \
            opencode run -m opencode/claude-sonnet-4-6 "A new issue has been created:

          Issue number: $N
          Issue author association: $ASSOC

          Lookup this issue with gh issue view $N.

          You have TWO tasks. Perform both, then post a SINGLE comment (if needed).

          ---

          TASK 1: CONTRIBUTING GUIDELINES COMPLIANCE CHECK

          Check whether the issue follows our contributing guidelines and issue templates.

          If the issue author association is OWNER or MEMBER, skip this compliance check. Do not add the needs:compliance label for organization-owned issues.

          This project has three issue templates that every issue MUST use one of:

          1. Bug Report - requires a Description field with real content
          2. Feature Request - requires a verification checkbox and description, title should start with [FEATURE]:
          3. Question - requires the Question field with real content

          Additionally check:
          - No AI-generated walls of text (long, AI-generated descriptions are not acceptable)
          - The issue has real content, not just template placeholder text left unchanged
          - Bug reports should include some context about how to reproduce
          - Feature requests should explain the problem or need
          - We want to push for having the user provide system description & information

          Do NOT be nitpicky about optional fields. Only flag real problems like: no template used, required fields empty or placeholder text only, obviously AI-generated walls of text, or completely empty/nonsensical content.

          ---

          TASK 2: DUPLICATE CHECK

          Search through existing issues (excluding #$N) to find potential duplicates.
          Consider:
          1. Similar titles or descriptions
          2. Same error messages or symptoms
          3. Related functionality or components
          4. Similar feature requests

          Additionally, if the issue mentions keybinds, keyboard shortcuts, or key bindings, note the pinned keybinds issue #4997.

          ---

          POSTING YOUR COMMENT:

          Based on your findings, post a SINGLE comment on issue #$N. Build the comment as follows:

          If the issue is NOT compliant and the author association is not OWNER or MEMBER, start the comment with:
          <!-- issue-compliance -->
          Then explain what needs to be fixed and that they have 72 hours to edit the issue before it is automatically closed. Also add the label needs:compliance to the issue using: gh issue edit $N --add-label needs:compliance

          If duplicates were found, include a section about potential duplicates with links.

          If the issue mentions keybinds/keyboard shortcuts, include a note about #4997.

          If the issue IS compliant AND no duplicates were found AND no keybind reference, do NOT comment at all.

          Use this format for the comment:

          [If not compliant:]
          <!-- issue-compliance -->
          This issue doesn't fully meet our [contributing guidelines](../blob/dev/CONTRIBUTING.md).

          **What needs to be fixed:**
          - [specific reasons]

          Please edit this issue to address the above within **72 hours**, or it will be automatically closed.

          [If duplicates found, add:]
          ---
          This issue might be a duplicate of existing issues. Please check:
          - #[issue_number]: [brief description of similarity]

          [If keybind-related, add:]
          For keybind-related issues, please also check our pinned keybinds documentation: #4997

          [End with if not compliant:]
          If you believe this was flagged incorrectly, please let a maintainer know.

          Remember: post at most ONE comment combining all findings. If everything is fine, post nothing." || echo "compliance/duplicate pass failed for #$N; next sweep retries while in window"
            echo "=== issue #$N (triage) ==="
            TITLE=$(gh issue view "$N" --json title --jq .title)
            BODY=$(gh issue view "$N" --json body --jq .body)
            ISSUE_NUMBER="$N" ISSUE_TITLE="$TITLE" ISSUE_BODY="$BODY" \
            opencode run --agent triage "The following issue was recently opened, triage it:

          Title: $TITLE

          $BODY" || echo "triage pass failed for #$N; next sweep retries while in window"
          done < new_issues.txt

      # ---- LLM duty: compliance recheck (absorbed:
      # ---- duplicate-issues recheck-compliance) ----
      - name: Compliance rechecks
        if: steps.candidates.outputs.total != '0'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          COUNT=0
          while read -r N ASSOC LOGIN; do
            [ -n "$N" ] || continue
            if [ "$COUNT" -ge 2 ]; then echo "per-pass cap reached"; break; fi
            if [ "$LOGIN" = "opencode-agent[bot]" ] || [ "$ASSOC" = "OWNER" ] || [ "$ASSOC" = "MEMBER" ] || grep -qxiF "$LOGIN" .github/TEAM_MEMBERS; then
              echo "Skipping exempt author $LOGIN for issue #$N"; continue
            fi
            COUNT=$((COUNT + 1))
            echo "=== issue #$N (compliance recheck) ==="
            OPENCODE_PERMISSION='{"bash": {"*": "deny", "gh issue*": "allow", "gh api*": "allow"}, "webfetch": "deny"}' \
            opencode run -m opencode/claude-sonnet-4-6 "Issue #$N was previously flagged as non-compliant and has been edited.
          Issue author association: $ASSOC

          Lookup this issue with gh issue view $N.

          If the issue author association is OWNER or MEMBER, remove the needs:compliance label if present, delete the previous compliance comment if present, and do not post a new comment.

          Re-check whether the issue now follows our contributing guidelines and issue templates.

          This project has three issue templates that every issue MUST use one of:

          1. Bug Report - requires a Description field with real content
          2. Feature Request - requires a verification checkbox and description, title should start with [FEATURE]:
          3. Question - requires the Question field with real content

          Additionally check:
          - No AI-generated walls of text (long, AI-generated descriptions are not acceptable)
          - The issue has real content, not just template placeholder text left unchanged
          - Bug reports should include some context about how to reproduce
          - Feature requests should explain the problem or need
          - We want to push for having the user provide system description & information

          Do NOT be nitpicky about optional fields. Only flag real problems like: no template used, required fields empty or placeholder text only, obviously AI-generated walls of text, or completely empty/nonsensical content.

          If the issue is NOW compliant:
          1. Remove the needs:compliance label: gh issue edit $N --remove-label needs:compliance
          2. Find and delete the previous compliance comment (the one containing <!-- issue-compliance -->) using the gh api comments list for issue $N, then delete it with gh api -X DELETE on that comment.
          3. Post a short comment thanking them for updating the issue.

          If the issue is STILL not compliant:
          Post a comment explaining what still needs to be fixed. Keep the needs:compliance label." || echo "recheck failed for #$N; next sweep retries while in window"
          done < recheck_issues.txt

      # ---- LLM duty: duplicate PRs (absorbed: pr-management
      # ---- check-duplicates; same script, same comment shape) ----
      - name: Duplicate PR check
        if: steps.candidates.outputs.total != '0'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          COUNT=0
          while read -r N ASSOC LOGIN; do
            [ -n "$N" ] || continue
            if [ "$COUNT" -ge 2 ]; then echo "per-pass cap reached"; break; fi
            if [ "$LOGIN" = "opencode-agent[bot]" ] || grep -qxF "$LOGIN" .github/TEAM_MEMBERS; then
              echo "Skipping team/bot PR #$N"; continue
            fi
            # Idempotency: the original fired once at opened; skip PRs
            # that already carry the LLM duplicate comment.
            if gh pr view "$N" --json comments --jq '.comments[].body' | grep -q "made by an LLM"; then
              echo "PR #$N already has a duplicate-check comment; skipping"; continue
            fi
            COUNT=$((COUNT + 1))
            echo "=== PR #$N (duplicate check) ==="
            {
              echo "Check for duplicate PRs related to this new PR:"
              echo ""
              echo "CURRENT_PR_NUMBER: $N"
              echo ""
              echo "Title: $(gh pr view "$N" --json title --jq .title)"
              echo ""
              echo "Description:"
              gh pr view "$N" --json body --jq .body
            } > pr_info.txt
            COMMENT=$(bun script/duplicate-pr.ts -f pr_info.txt "Check the attached file for PR details and search for duplicates") || { echo "duplicate-pr script failed for #$N"; continue; }
            if [ "$COMMENT" != "No duplicate PRs found" ]; then
              gh pr comment "$N" --body "_The following comment was made by an LLM, it may be inaccurate:_

          $COMMENT"
            fi
          done < new_prs.txt
