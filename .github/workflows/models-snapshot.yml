name: models-snapshot
# RUNNER-SWITCH (2026-10-18): runners in this workflow were switched from Blacksmith to
# GitHub-hosted at Drew's direction. To switch back, grep the repo for RUNNER-SWITCH and
# swap each commented Blacksmith line back in for the active line under it. To choose per
# run instead, use an expression on runs-on, e.g. ${{ vars.RUNNER_UBUNTU || 'ubuntu-24.04' }},
# or gate individual steps with if: on the runner.

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,12 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
  queue: max

jobs:
  refresh:
    timeout-minutes: 30
    # FORK BEHAVIOUR (#109): unlike the deliberately-gated upstream workflows
    # (deploy/publish), this refresh produces an artifact this fork's own code
    # consumes — the bundled snapshot is the boot-time floor for the model
    # catalog — so it runs on this fork too, against its real default branch
    # (main; there is no dev branch here).
    # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runs-on: blacksmith-4vcpu-ubuntu-2404
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: main

      # The refresh script only needs `fetch`; skip the monorepo install.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The app token is preferred (its pushes trigger downstream workflows),
      # but on a repo where the app is not configured the token step fails
      # with "appId option is required" and the refreshed snapshot is thrown
      # away — the same failure fixed for nix-hashes in #189. Fall back to
      # GITHUB_TOKEN there: its pushes do not trigger downstream workflows,
      # which a snapshot.txt commit does not need.
      - name: Setup git committer
        if: vars.OPENCODE_APP_ID != ''
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Setup git committer (fallback token)
        if: vars.OPENCODE_APP_ID == ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

      - name: Refresh snapshot
        run: bun packages/core/script/update-models-snapshot.ts

      - name: Commit changes
        run: |
          set -euo pipefail

          FILE="packages/core/src/models-dev/snapshot.txt"

          if [ -z "$(git status --short -- "$FILE")" ]; then
            echo "No changes to commit"
            echo "### models.dev snapshot" >> "$GITHUB_STEP_SUMMARY"
            echo "Status: no changes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add "$FILE"
          git commit -m "chore(core): refresh bundled models.dev snapshot"

          git pull --rebase --autostash origin main
          git push origin HEAD:main --no-verify

          echo "### models.dev snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: committed $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
