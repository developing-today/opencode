name: stats
# RUNNER-SWITCH (2026-10-18): runners in this workflow were switched from Blacksmith to
# GitHub-hosted at Drew's direction. To switch back, grep the repo for RUNNER-SWITCH and
# swap each commented Blacksmith line back in for the active line under it. To choose per
# run instead, use an expression on runs-on, e.g. ${{ vars.RUNNER_UBUNTU || 'ubuntu-24.04' }},
# or gate individual steps with if: on the runner.

on:
  schedule:
    - cron: "0 12 * * *" # Run daily at 12:00 UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  queue: max

jobs:
  stats:
    timeout-minutes: 15
    if: github.repository == 'anomalyco/opencode'
    # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runs-on: blacksmith-4vcpu-ubuntu-2404
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run stats script
        run: bun script/stats.ts

      - name: Commit stats
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add STATS.md
          git diff --staged --quiet || git commit -m "ignore: update download stats $(date -I)"
          git push
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
