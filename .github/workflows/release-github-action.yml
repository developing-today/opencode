name: release-github-action
# RUNNER-SWITCH (2026-10-18): runners in this workflow were switched from Blacksmith to
# GitHub-hosted at Drew's direction. To switch back, grep the repo for RUNNER-SWITCH and
# swap each commented Blacksmith line back in for the active line under it. To choose per
# run instead, use an expression on runs-on, e.g. ${{ vars.RUNNER_UBUNTU || 'ubuntu-24.04' }},
# or gate individual steps with if: on the runner.

# FORK BEHAVIOUR (#197, decision 2026-10-21 — deliberate releases only): the
# inherited trigger targeted upstream's `dev` branch, which this fork does not
# have, so this workflow never ran here (1 run ever, a cancelled 2026-10-11
# `dev` push; publish-github-action has 0 runs ever) and no `github-v*` tag
# could ever be cut from this fork. The trigger was NOT retargeted to `main`:
# cutting a release is publishing — it creates a `github-v*` tag and, via
# publish, moves the `latest` tag — so it stays a deliberate maintainer
# action, like the containers push in #172. Dispatch this workflow manually
# (choose `minor` for a minor bump; the release script's baseline was
# sanity-checked 2026-10-21: latest `github-v*` by committer date is
# github-v1.2.25, so a patch dispatch cuts github-v1.2.26 and a minor
# dispatch cuts github-v1.3.0). Afterwards, dispatch publish-github-action
# manually too: tags pushed with the default GITHUB_TOKEN do not trigger
# other workflows, so publish's tag trigger does not fire from this run.

on:
  workflow_dispatch:
    inputs:
      minor:
        description: "Bump the minor version instead of the patch version"
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 30
    # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runs-on: blacksmith-4vcpu-ubuntu-2404
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - name: Release
        run: |
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"
          if [ "${{ inputs.minor }}" = "true" ]; then
            ./github/script/release --minor
          else
            ./github/script/release
          fi
