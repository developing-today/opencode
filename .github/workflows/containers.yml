name: containers
# RUNNER-SWITCH (2026-10-18): runners in this workflow were switched from Blacksmith to
# GitHub-hosted at Drew's direction. To switch back, grep the repo for RUNNER-SWITCH and
# swap each commented Blacksmith line back in for the active line under it. To choose per
# run instead, use an expression on runs-on, e.g. ${{ vars.RUNNER_UBUNTU || 'ubuntu-24.04' }},
# or gate individual steps with if: on the runner.

# FORK BEHAVIOUR (#172, decision 2026-10-21 — build-only): the inherited trigger
# targeted upstream's `dev` branch, which this fork does not have, so the workflow
# never ran here and container changes landed unverified. Pushes to `main` now
# build every image and push nothing; publishing stays deliberate — dispatch the
# workflow manually with the `push` input set to true.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - packages/containers/**
      - .github/workflows/containers.yml
      - package.json
  workflow_dispatch:
    inputs:
      push:
        description: "Push the built images to GHCR (a plain dispatch builds only and pushes nothing)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    timeout-minutes: 90
    # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runs-on: blacksmith-4vcpu-ubuntu-2404
    runs-on: ubuntu-24.04
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: "24.04"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      # QEMU, Buildx and the GHCR login serve only the multi-arch push build;
      # the build-only path uses plain `docker build` and never authenticates.
      - name: Set up QEMU
        if: inputs.push
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: inputs.push
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build containers
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            bun ./packages/containers/script/build.ts --push
          else
            bun ./packages/containers/script/build.ts
          fi
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ env.TAG }}
