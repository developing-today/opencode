name: publish-vscode
# CI tier policy: .github/ci-policy.md (fast PR tier, full main tier).
# RUNNER-SWITCH (2026-10-18): runners in this workflow were switched from Blacksmith to
# GitHub-hosted at Drew's direction. To switch back, grep the repo for RUNNER-SWITCH and
# swap each commented Blacksmith line back in for the active line under it. To choose per
# run instead, use an expression on runs-on, e.g. ${{ vars.RUNNER_UBUNTU || 'ubuntu-24.04' }},
# or gate individual steps with if: on the runner.

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*.*.*"

concurrency:
  # Releases are never cancelled mid-publish: push-to-main, tag pushes and
  # manual dispatches are keyed by run_id (unique group, cancel can never
  # fire); branch pushes keep the ref-keyed group and cancel on supersede.
  # Standard pattern: design ci-fast-pr-full-main §4 / .github/ci-policy.md.
  group: ${{ github.workflow }}-${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    timeout-minutes: 60
    # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runs-on: blacksmith-4vcpu-ubuntu-2404
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - run: git fetch --force --tags
      - run: bun install -g @vscode/vsce

      - name: Install extension dependencies
        run: bun install
        working-directory: ./sdks/vscode

      - name: Publish
        run: |
          ./script/publish
        working-directory: ./sdks/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
