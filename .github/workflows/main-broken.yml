name: main-broken
# CI tier policy: .github/ci-policy.md (fast PR tier, full main tier).
#
# Phase 3 remediation chain (developing-today/code#1782, design
# ci-fast-pr-full-main section 5): when a main-tier workflow fails on
# main, file (or append to) exactly one `main-broken` issue per
# Breakage-ID so the fleet queue owns the breakage at top priority.
#
# Breakage-ID = first 12 hex of
#   sha256("developing-today/opencode|<workflow>|<sorted failing job names>")
#
# DISPATCH HANDOFF: the Jules leg is retired fleet-wide (this repo
# never had a Jules API key secret, so the Jules-first step of the
# chain never fired here). Breakages are handed to the fleet queue
# via pm-dispatch (the pm-dispatch-queue reusable action from
# developing-today/code) at filing time: a new Breakage-ID files one
# issue plus a queued task, and repeat failures with the same ID
# attach a fresh task to the existing issue instead of filing anew.

on:
  workflow_run:
    # The main-tier workflows only -- watching "*" is the #304 fan-out
    # trap (a skipped no-op run for every workflow completion).
    workflows: ["test", "check", "nix-eval"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a failed main run to process (blank = latest failed main run)"
        required: false
        type: string
      dry_run:
        description: "Compute and print the filing decision without writing any issue"
        required: false
        type: boolean
        default: true

# Per-run group: a watcher run must never displace another watcher run.
# cancel-in-progress stays false, and this workflow never triggers on
# issues/pull_request_target, so queue: max is valid here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true
  queue: max

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  watch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Compute the main-broken filing decision
        id: filing
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          REPO="developing-today/opencode"
          DRY="$INPUT_DRY_RUN"
          RUN_ID="$INPUT_RUN_ID"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$WR_RUN_ID"
            DRY="false"
          fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$REPO" --branch main --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "processing run $RUN_ID (dry_run=$DRY)"

          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          WF=$(jq -r '.name' run.json)
          SHA=$(jq -r '.head_sha' run.json)
          URL=$(jq -r '.html_url' run.json)
          BRANCH=$(jq -r '.head_branch' run.json)
          if [ "$BRANCH" != "main" ]; then
            echo "run $RUN_ID is on branch '$BRANCH', not main -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FAILING=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name] | sort | join(",")')
          if [ -z "$FAILING" ]; then
            echo "run $RUN_ID has no failed jobs -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FIRST=$(printf '%s' "$FAILING" | cut -d, -f1)
          SHORT="${SHA:0:7}"
          BID=$(printf '%s' "$REPO|$WF|$FAILING" | sha256sum | cut -c1-12)
          echo "workflow=$WF sha=$SHORT failing=[$FAILING] Breakage-ID=$BID"

          EXISTING=$(gh issue list --repo "$REPO" --state open --label main-broken \
            --search "$BID" --json number --jq '.[0].number // empty')

          if [ "$DRY" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              echo "DRY RUN: would append run $URL to existing issue #$EXISTING"
            else
              echo "DRY RUN: would file a new main-broken issue for Breakage-ID $BID"
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Coin the chain labels if missing (idempotent: --force updates).
          gh label create "kind/ci" --repo "$REPO" --color fbca04 --description "CI/CD pipelines, workflows, and build automation" --force
          gh label create "priority/critical" --repo "$REPO" --color b60205 --description "Drop everything: main broken, security exposure, repo-wide outage" --force
          gh label create "main-broken" --repo "$REPO" --color B60205 --description "main branch full-suite (main tier) is red; remediation chain owns this" --force
          gh label create "queue/queued" --repo "$REPO" --color 7057ff --description "Has a queued task in the Supabase agent queue" --force
          gh label create "status/needs-triage" --repo "$REPO" --color fbca04 --description "Not yet triaged; needs a first look" --force

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$EXISTING" ]; then
            cat > prompt.md <<BODY
          <!-- agent-note:v1 -->
          agent-note:v1 -- main-broken chain (append, $NOW)
          - same Breakage-ID \`$BID\` failed again: $URL
          - failing jobs: $FAILING
          - holder: unchanged (see the filing note on this issue); a fresh task is attached to this issue via pm-dispatch -- no duplicate filing
          BODY
          else
            cat > prompt.md <<BODY
          Main-tier workflow \`$WF\` failed on \`main\`.

          - Run: $URL
          - Head commit: $SHA
          - Failing jobs: $FAILING
          - First failing job: $FIRST
          - Logs / first error excerpt: see the run's failed-job logs at the run URL above.

          Breakage-ID: $BID

          <!-- agent-note:v1 -->
          agent-note:v1 -- main-broken chain (filing, $NOW)
          - holder: fleet queue (chain filing) -- filed with \`queue/queued\` for a priority Muse lane
          - dispatch: handed to the fleet queue via pm-dispatch at filing time; the Jules leg is retired fleet-wide, so no \`jules\` label is applied or expected to trigger remediation
          - dedupe: Breakage-ID \`$BID\`; repeat failures with the same ID append to this issue instead of filing anew
          BODY
          fi

          {
            echo "skip=false"
            echo "existing=$EXISTING"
            echo "title=main-broken: $REPO $WF @$SHORT -- $FIRST"
            echo "prompt<<PROMPT_EOF"
            cat prompt.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$EXISTING" ]; then
            echo "append decision recorded for existing issue #$EXISTING"
          else
            echo "filing decision recorded for Breakage-ID $BID"
          fi

      - name: Queue a new main-broken issue via pm-dispatch
        id: queue-new
        if: steps.filing.outputs.skip == 'false' && steps.filing.outputs.existing == ''
        uses: developing-today/code/.github/actions/pm-dispatch-queue@main
        with:
          title: ${{ steps.filing.outputs.title }}
          prompt: ${{ steps.filing.outputs.prompt }}
          priority: "critical"
          kind: "ci_investigation"
          issue: "true"

      # Dispatch-created issues carry only queue/queued + source/dispatch;
      # re-apply the workflow's full label set on the created issue.
      - name: Apply the main-broken label set to the new issue
        if: steps.queue-new.outputs.issue_number != ''
        run: |
          gh issue edit "${{ steps.queue-new.outputs.issue_number }}" --repo "${{ github.repository }}" --add-label "kind/ci,priority/critical,main-broken,queue/queued,status/needs-triage"

      - name: Attach a fresh task to the existing main-broken issue via pm-dispatch
        if: steps.filing.outputs.skip == 'false' && steps.filing.outputs.existing != ''
        uses: developing-today/code/.github/actions/pm-dispatch-queue@main
        with:
          title: ${{ steps.filing.outputs.title }}
          prompt: ${{ steps.filing.outputs.prompt }}
          priority: "critical"
          kind: "ci_investigation"
          issue_number: ${{ steps.filing.outputs.existing }}
