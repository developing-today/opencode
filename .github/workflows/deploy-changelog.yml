name: deploy-changelog

on:
  push:
    branches:
      - dev
    paths:
      - services/changelog/**
      - .github/workflows/deploy-changelog.yml
  workflow_dispatch:

concurrency:
  group: deploy-changelog
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 30
    if: github.repository == 'anomalyco/opencode' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        working-directory: services/changelog
        run: bun typecheck

      - name: Test
        working-directory: services/changelog
        run: bun test

      - name: Deploy
        working-directory: services/changelog
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
