name: deploy-files

on:
  push:
    branches:
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: deploy-files-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 30
    if: github.repository == 'anomalyco/opencode' && (github.ref_name == 'dev' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        working-directory: services/files
        run: bun typecheck

      - name: Deploy
        working-directory: services/files
        run: bun run deploy --env ${{ github.ref_name == 'production' && 'production' || 'dev' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
