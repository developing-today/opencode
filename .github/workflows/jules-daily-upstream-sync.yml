name: Jules Daily Upstream Sync (OpenCode)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  queue: max

# Daily automated upstream sync, conflict resolution, feature-opportunity triage,
# and safe merging for developing-today/opencode using Google Jules.

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Automatically merge the PR if all tests and validation pass"
        type: boolean
        default: true
      create_feature_issues:
        description: "Analyze new upstream features and file GitHub issues for adoption opportunities"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  daily-upstream-sync:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Run Jules Upstream Sync Agent
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          include_commit_log: true
          prompt: >-
            Perform the daily upstream sync of OpenCode v2 from upstream anomalyco/opencode (branch `dev`) into `main`.

            Follow these strict requirements and principles:

            ### 1. UPSTREAM TRACKING POLICY
            - Track upstream `dev` exclusively (upstream promoted v2 to `dev` on Oct 10, 2026; legacy v1 is on `v1`).
            - Merge upstream `dev` into our `main` branch: `git fetch upstream dev && git merge --no-ff upstream/dev`.

            ### 2. CONFLICT RESOLUTION & CAPABILITY PRESERVATION RULES
            - **Preserve All Features**: Keep all features, tools, skills, route definitions, and capabilities from BOTH sides.
            - **No Deprecations**: If upstream removed an API, feature, parameter, or route that our fork uses or provides, DO NOT remove it on our side. We want more capabilities and features in general.
            - **Reduce Future Conflicts**: Where appropriate, isolate fork additions and extensions into separate/modular files (`.ts`, plugins, skill files) rather than interleaving them in large upstream files, so future merges conflict less often.
            - **Schema & Migrations**: Ensure database migrations in `packages/core/src/database/migration/` are monotonically numbered and registered in `migration.gen.ts`. Run `bun run --cwd packages/core migration --check` to guarantee schema consistency.
            - **Language / i18n Parity**: Ensure all locale dictionary keys stay in 100% key parity with English. Fallback gracefully to English strings if translations are absent to prevent merge friction.

            ### 3. FEATURE OPPORTUNITY TRIAGE & ISSUE CREATION
            - Inspect the newly merged upstream commits (`git log ... --grep="^feat"`).
            - Identify if any new upstream capabilities, refactors, or UI surfaces could be adopted or built upon by our fork's features (such as model routing, tier-aware pooling, token cost accounting, quota tracking, or MCPX).
            - For each identified high-value synergy, create a comprehensive GitHub issue using `gh issue create --repo developing-today/opencode` containing:
              - Clear title and summary
              - Upstream commit references
              - Architectural context and user story
              - Concrete technical specifications and relevant file paths
              - Complete acceptance criteria
              (Ensure enough detail that a brand-new agent with zero prior context can implement it).

            ### 4. VALIDATION & TESTING
            - Run full typecheck and linting: `bun run check`.
            - Run core routing and telemetry test suites: `bun test test/model-*.test.ts test/route-*.test.ts`.
            - Verify that all tests that weren't already failing continue to pass, and all newly merged tests pass.

            ### 5. PULL REQUEST & SAFE MERGE
            - Update the `README.md` fork notice with the latest upstream commit SHA and timestamp.
            - Open a clean, conflict-free Pull Request detailing all merged upstream commits and resolved conflicts.
            - Merge the PR into `main` only when you are reasonably certain it is correct: tests pass cleanly, there are no regressions, and the sync is conflict-free. Merging is permitted, never required — when any of that is uncertain, leave the PR open and state your confidence and what a human should check in the description.

      - name: Record a sync failure for the Muse tasks
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          title="chore(deps): automated upstream sync failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --state open --search "\"$title\" in:title" --limit 100 --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "Upstream sync failed again: ${run_url}. Jules runs this sync itself, so a failed run means Jules could not complete it. Muse repo tasks: please triage and land the sync."
          else
            gh issue create --title "$title" --body "The daily Jules upstream-sync workflow failed: ${run_url}. Jules performs this sync itself, so a workflow failure means Jules could not complete it (an unresolvable merge conflict, an API failure, or a failed validation after its PR). Per Drew's escalation chain (2026-10-28), the Muse repo tasks take over from here: reproduce the upstream merge in a laptop worktree, resolve conflicts preserving both sides' features per the workflow prompt, verify, and land the sync as a PR. This issue is maintained by the jules-daily-upstream-sync workflow: repeat failures comment here; close it once a sync run succeeds."
          fi

      - name: Close the sync failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          title="chore(deps): automated upstream sync failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --state open --search "\"$title\" in:title" --limit 100 --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)
          if [ -n "${number}" ]; then
            gh issue close "${number}" --comment "Upstream sync succeeded: ${run_url}. Closing as promised in the tracking issue body; a later failure will open a fresh tracking issue."
          fi
